        <h1>Balboa High School Class of 1987: 40th Reunion Planner</h1>
        <p>bhs87.com is the Balboa High School Class of '87's own site for our 40th reunion at the Canal Zone Reunion (CZR) in Panama City, Panama, January 17&ndash;24, 2027.</p>
        <h2>Why sign up</h2>
        <ul>
          <li>Claim your name on the Class of 1987 roster with a one-time email link. No password, and your email is never shown.</li>
          <li>Plan your reunion week in about two minutes: your dates, the Yacht Club '87 Dinner/Dance (Wed Jan 20, 2027) and the CZR events you're going to, all on one calendar.</li>
          <li>See which classmates are in town on which days and the best times for the group to meet.</li>
          <li>Join interest groups for shared outings, with best times, venue ideas and a group chat link.</li>
          <li>Ticket Watch shows which CZR 2027 events are sold out or almost gone.</li>
          <li>Flip through the 1987 Balboa High School yearbook and add a current photo if you had no senior portrait.</li>
        </ul>
        <p>This planner needs JavaScript. Read more on the <a href="/about">Why join bhs87.com</a> page.</p>
